name: CI - Tests & Lint

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: testdb
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 12

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup test environment
        run: |
          cp apps/api/.env.example apps/api/.env.test
          echo "DATABASE_URL=postgresql://testuser:testpass@localhost:5432/testdb?sslmode=disable" >> apps/api/.env.test
          echo "DIRECT_DATABASE_URL=postgresql://testuser:testpass@localhost:5432/testdb?sslmode=disable" >> apps/api/.env.test
          echo "JWT_ACCESS_SECRET=test_access_secret_key_for_ci" >> apps/api/.env.test
          echo "JWT_REFRESH_SECRET=test_refresh_secret_key_for_ci" >> apps/api/.env.test
          echo "NODE_ENV=test" >> apps/api/.env.test

      - name: Run Prisma migrations
        working-directory: apps/api
        run: pnpm prisma migrate deploy
        env:
          DATABASE_URL: postgresql://testuser:testpass@localhost:5432/testdb?sslmode=disable
          DIRECT_DATABASE_URL: postgresql://testuser:testpass@localhost:5432/testdb?sslmode=disable

      - name: Run tests
        working-directory: apps/api
        run: pnpm test

      - name: Run syntax check
        working-directory: apps/api
        run: pnpm check

      - name: Run security audit
        run: pnpm audit --audit-level=moderate || true

  security:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Run security scanning
        run: |
          echo "✓ Security checks enabled via dependabot"
